name: derle-ve-test

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dogrula:
    name: Sozdizimi + gercek Windows'ta sessiz kurulum testi
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: PowerShell sozdizimi ve JSON kontrolu
        shell: powershell
        run: |
          $hata = 0
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null; $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errs) | Out-Null
            foreach ($e in $errs) {
              Write-Host "::error file=$($_.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)"
              $hata++
            }
          }
          $cfg = Get-Content installer\bilesenler.json -Raw -Encoding UTF8 | ConvertFrom-Json
          $idler = @($cfg.bilesenler.id)
          foreach ($b in $cfg.bilesenler) {
            foreach ($g in @($b.gerekir)) {
              if ($g -and ($idler.IndexOf($g) -lt 0 -or $idler.IndexOf($g) -gt $idler.IndexOf($b.id))) {
                Write-Host "::error::$($b.id) -> '$g' bagimliligi yok ya da listede sonra geliyor"; $hata++
              }
            }
          }
          Write-Host "$($idler.Count) bilesen okundu."
          if ($hata) { exit 1 }

      - name: PSScriptAnalyzer (yalnizca Error)
        shell: powershell
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -SkipPublisherCheck
          $r = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error
          $r | Format-Table -AutoSize | Out-String | Write-Host
          if ($r) { exit 1 }

      - name: Sessiz kurulum (anahtarsiz bilesenler)
        shell: powershell
        run: |
          .\installer\RepoKurulum.ps1 -Sessiz -Bilesenler "uv,claude,mcp-timeout,playwright-mcp,context7,duckduckgo-mcp,markitdown-mcp,graphify,repomix-mcp"
          $kod = $LASTEXITCODE
          Write-Host "Cikis kodu: $kod"
          $hatalar = Select-String -Path "$env:LOCALAPPDATA\RepoKurulum\logs\*.log" -Pattern '\[HATA\]'
          if ($hatalar) { $hatalar | ForEach-Object { Write-Host "::error::$($_.Line)" }; exit 1 }
          exit $kod

      - name: Ikinci calistirma her seyi atlamali (idempotent)
        shell: powershell
        run: |
          .\installer\RepoKurulum.ps1 -Liste
          .\installer\RepoKurulum.ps1 -Sessiz -Bilesenler "playwright-mcp,graphify,repomix-mcp"
          exit $LASTEXITCODE

      - name: Yeni bilesenler (plugin, NotebookLM, FFmpeg, video skill, animasyon)
        shell: powershell
        timeout-minutes: 20
        run: |
          .\installer\RepoKurulum.ps1 -Sessiz -Bilesenler "karpathy,replica-skill,notebooklm,ffmpeg,video-shotcraft,animation-base"
          $kod = $LASTEXITCODE
          $log = Get-ChildItem "$env:LOCALAPPDATA\RepoKurulum\logs\*.log" | Sort-Object LastWriteTime | Select-Object -Last 1
          $hatalar = Select-String -Path $log.FullName -Pattern '\[HATA\]'
          if ($hatalar) { $hatalar | ForEach-Object { Write-Host "::error::$($_.Line)" }; exit 1 }
          .\installer\RepoKurulum.ps1 -Liste
          exit $kod

      - name: Durum satiri ve model secimi (settings.json birlestirme)
        shell: powershell
        run: |
          $hata = @()
          # 1) Durum satiri betigi ornek oturum verisiyle
          $cikti = Get-Content tests\statusline-ornek.json -Raw | powershell -NoProfile -ExecutionPolicy Bypass -File installer\claude\repokurulum-statusline.ps1 | Out-String
          Write-Host $cikti
          foreach ($b in 'Opus 5.5','TISG-Maximon/repokurulum','Baglam','42%','5 saat','23%','Haftalik','61%','Oturum') { if ($cikti -notmatch [regex]::Escape($b)) { $hata += "durum satirinda yok: $b" } }
          # Transkriptli calisma: son arac dogru bulunmali, renk kodlari bozulmamali (degisken cakismasi testi)
          $ornek = Get-Content tests\statusline-ornek.json -Raw | ConvertFrom-Json
          $ornek.transcript_path = "$PWD\tests\transkript-ornek.jsonl"
          $cikti2 = ($ornek | ConvertTo-Json -Depth 10) | powershell -NoProfile -ExecutionPolicy Bypass -File installer\claude\repokurulum-statusline.ps1 | Out-String
          Write-Host $cikti2
          if ($cikti2 -notmatch 'son arac: .*playwright > browser_navigate') { $hata += 'son arac bulunamadi' }
          foreach ($kotu in '@{','api-request','tool_use','"type"') { if ($cikti2 -match [regex]::Escape($kotu)) { $hata += "durum satirinda ham veri sizdi: $kotu" } }
          if (($cikti2 -split "`n" | Where-Object { $_.Trim() }).Count -ne 2) { $hata += 'durum satiri 2 satir olmali' }
          # 2) Kullanicinin mevcut ayari korunmali
          $md = "$env:USERPROFILE\.claude"; New-Item -ItemType Directory -Force $md | Out-Null
          $ayar = "$md\settings.json"
          if (Test-Path $ayar) { $mevcut = Get-Content $ayar -Raw | ConvertFrom-Json } else { $mevcut = New-Object PSObject }
          $mevcut | Add-Member -NotePropertyName ozelTestAyari -NotePropertyValue 'korunmali' -Force
          $mevcut | ConvertTo-Json -Depth 32 | Set-Content $ayar -Encoding UTF8
          .\installer\RepoKurulum.ps1 -Sessiz -Bilesenler "durum-satiri,model-secimi"
          if ($LASTEXITCODE -ne 0) { $hata += "kurulum cikis kodu $LASTEXITCODE" }
          $s = Get-Content $ayar -Raw | ConvertFrom-Json
          Get-Content $ayar -Raw | Write-Host
          if ($s.ozelTestAyari -ne 'korunmali') { $hata += 'mevcut ayar silindi' }
          if ($s.statusLine.command -notmatch 'repokurulum-statusline') { $hata += 'statusLine yazilmadi' }
          if ($s.statusLine.command -match '\\') { $hata += 'statusLine yolunda ters egik cizgi var' }
          if ($s.model -ne 'opus') { $hata += 'model opus degil' }
          if ($s.effortLevel -ne 'medium') { $hata += 'effortLevel medium degil' }
          if (-not (Test-Path "$ayar.repokurulum.bak")) { $hata += 'yedek alinmadi' }
          foreach ($a in 'hizli-isci','derin-analist','dogrulayici') { if (-not (Test-Path "$md\agents\$a.md")) { $hata += "ajan yok: $a" } }
          # 3) settings.json'daki komut gercekten calisiyor mu
          $komutCikti = Get-Content tests\statusline-ornek.json -Raw | cmd /c $s.statusLine.command | Out-String
          if ($komutCikti -notmatch 'Baglam') { $hata += 'settings.json komutu calismadi' }
          # 4) Ikinci calistirma atlamali
          .\installer\RepoKurulum.ps1 -Sessiz -Bilesenler "durum-satiri,model-secimi" | Out-Null
          if ($hata) { $hata | ForEach-Object { Write-Host "::error::$_" }; exit 1 }

      - name: NotebookLM hafiza (hook, izin, ozet ve sir maskeleme)
        shell: powershell
        run: |
          $hata = @()
          $md = "$env:USERPROFILE\.claude"; New-Item -ItemType Directory -Force $md | Out-Null
          $ayar = "$md\settings.json"
          if (Test-Path $ayar) { $s0 = Get-Content $ayar -Raw | ConvertFrom-Json } else { $s0 = New-Object PSObject }
          # Kullanicinin mevcut bir SessionEnd hook'u korunmali
          $mevcut = [pscustomobject]@{ hooks = @([pscustomobject]@{ type = 'command'; command = 'echo kullanici-hooku' }) }
          $s0 | Add-Member -NotePropertyName hooks -NotePropertyValue ([pscustomobject]@{ SessionEnd = @($mevcut) }) -Force
          $s0 | ConvertTo-Json -Depth 32 | Set-Content $ayar -Encoding UTF8
          .\installer\RepoKurulum.ps1 -Sessiz -Bilesenler "notebooklm-hafiza"
          $s = Get-Content $ayar -Raw | ConvertFrom-Json
          Get-Content $ayar -Raw | Write-Host
          $se = @($s.hooks.SessionEnd | ForEach-Object { $_.hooks } | ForEach-Object { $_.command })
          if ($se -notcontains 'echo kullanici-hooku') { $hata += 'kullanicinin hook-u silindi' }
          if (-not ($se | Where-Object { $_ -match 'repokurulum-hafiza' })) { $hata += 'SessionEnd hook-u yok' }
          if (-not (@($s.hooks.PreCompact | ForEach-Object { $_.hooks } | ForEach-Object { $_.command }) | Where-Object { $_ -match 'repokurulum-hafiza' })) { $hata += 'PreCompact hook-u yok' }
          if (@($s.permissions.allow) -notcontains 'Bash(notebooklm *)') { $hata += 'notebooklm izni yok' }
          # Ikinci kurulum hook-u cogaltmamali
          .\installer\RepoKurulum.ps1 -Sessiz -Bilesenler "notebooklm-hafiza" -Zorla | Out-Null
          $s2 = Get-Content $ayar -Raw | ConvertFrom-Json
          $adet = @($s2.hooks.SessionEnd | ForEach-Object { $_.hooks } | Where-Object { $_.command -match 'repokurulum-hafiza' }).Count
          if ($adet -ne 1) { $hata += "SessionEnd hafiza hook sayisi $adet (1 olmali)" }
          # Hook modu hemen donmeli
          $sure = Measure-Command { '{"session_id":"x","transcript_path":"","cwd":"C:\\","hook_event_name":"SessionEnd"}' | powershell -NoProfile -ExecutionPolicy Bypass -File "$md\repokurulum-hafiza.ps1" }
          if ($sure.TotalSeconds -gt 15) { $hata += "hook modu yavas: $($sure.TotalSeconds) sn" }
          # Ozet: CI'da Google girisi yok -> gonderilemez, bekleyene yazilmali; sirlar maskelenmis olmali
          powershell -NoProfile -ExecutionPolicy Bypass -File "$md\repokurulum-hafiza.ps1" -Arkaplan -Transkript "$PWD\tests\transkript-ornek.jsonl" -Oturum test-oturum-1 -Dizin "$PWD" -Olay SessionEnd
          $bek = Get-ChildItem "$env:LOCALAPPDATA\RepoKurulum\hafiza-bekleyen\*.md" | Select-Object -Last 1
          if (-not $bek) { $hata += 'bekleyen ozet yazilmadi' } else {
            $ozet = Get-Content $bek.FullName -Raw -Encoding UTF8
            Write-Host $ozet
            foreach ($b in 'Istekler','README dosyas','Degisen dosyalar','C:/proje/README.md','playwright','[GIZLENDI]') { if ($ozet -notmatch [regex]::Escape($b)) { $hata += "ozette yok: $b" } }
            foreach ($g in 'abcd1234GIZLIDEGER','ghp_ABCDEFGHIJKLMNOPQRSTUVWXYZ123456') { if ($ozet -match [regex]::Escape($g)) { $hata += "sir maskelenmedi: $g" } }
          }
          Get-Content "$env:LOCALAPPDATA\RepoKurulum\logs\hafiza.log" -ErrorAction SilentlyContinue | Write-Host
          if ($hata) { $hata | ForEach-Object { Write-Host "::error::$_" }; exit 1 }

      - name: Seslendirme ve sunum (edge-tts, Piper, HyperFrames, Marp) + gercek ses uretimi
        shell: powershell
        timeout-minutes: 20
        run: |
          .\installer\RepoKurulum.ps1 -Sessiz -Bilesenler "edge-tts,piper-tts,hyperframes,marp-cli"
          $kod = $LASTEXITCODE
          $log = Get-ChildItem "$env:LOCALAPPDATA\RepoKurulum\logs\*.log" | Sort-Object LastWriteTime | Select-Object -Last 1
          $hatalar = Select-String -Path $log.FullName -Pattern '\[HATA\]'
          if ($hatalar) { Select-String -Path $log.FullName -Pattern 'indiriliyor|Invoke-WebRequest:|HTTP:|curl:|INDIRILEMEDI|Hicbir|Piper sesleri' | ForEach-Object { Write-Host $_.Line }; $hatalar | ForEach-Object { Write-Host "::error::$($_.Line)" }; exit 1 }
          if ($kod -ne 0) { exit $kod }
          foreach ($y in @("$env:USERPROFILE\.local\bin", "$env:APPDATA\npm")) { $env:Path += ";$y" }
          $env:PIPER_SESLER = [Environment]::GetEnvironmentVariable('PIPER_SESLER', 'User')
          $t = Join-Path $env:RUNNER_TEMP 'ses'; New-Item -ItemType Directory -Force $t | Out-Null
          $ErrorActionPreference = 'Continue'
          Set-Content -Path "$t\metin.txt" -Value 'Merhaba, bu bir seslendirme testidir.' -Encoding UTF8
          [IO.File]::WriteAllText("$t\metin.txt", 'Merhaba, bu bir seslendirme testidir.', (New-Object System.Text.UTF8Encoding($false)))
          Write-Host "piper: $((Get-Command piper -ErrorAction SilentlyContinue).Source)"
          Get-ChildItem $env:PIPER_SESLER | ForEach-Object { Write-Host "ses dosyasi: $($_.Name) $($_.Length)" }
          $model = (Get-ChildItem "$env:PIPER_SESLER\tr_TR-*.onnx" | Select-Object -First 1).FullName
          & piper -m $model -i "$t\metin.txt" -f "$t\piper.wav" 2>&1 | Select-Object -Last 15 | Write-Host
          if (-not (Test-Path "$t\piper.wav") -or (Get-Item "$t\piper.wav").Length -lt 10000) { Write-Host '::error::Piper ses uretmedi'; exit 1 }
          & edge-tts --voice tr-TR-EmelNeural --file "$t\metin.txt" --write-media "$t\edge.mp3" --write-subtitles "$t\edge.srt" 2>&1 | Out-Null
          if (-not (Test-Path "$t\edge.mp3") -or (Get-Item "$t\edge.mp3").Length -lt 5000) { Write-Host '::warning::edge-tts ses uretmedi (Microsoft servisi CI''dan erisilemiyor olabilir)' }
          Set-Content -Path "$t\sunum.md" -Value "---`nmarp: true`n---`n# Baslik`n`n---`n# Ikinci slayt" -Encoding UTF8
          & marp "$t\sunum.md" --images png -o "$t\sunum.png" 2>&1 | Out-Null
          $png = @(Get-ChildItem "$t\sunum*.png")
          if ($png.Count -lt 2) { Write-Host "::error::Marp 2 slayt PNG uretmedi ($($png.Count))"; exit 1 }
          Write-Host "OK: piper.wav $((Get-Item "$t\piper.wav").Length) bayt, slayt PNG: $($png.Count)"
          $kural = & .\installer\RepoKurulum.ps1 -Kurallar | Out-String
          foreach ($k in @('Seslendirme', 'edge-tts', 'Piper', 'HyperFrames', 'Marp CLI')) { if ($kural -notmatch [regex]::Escape($k)) { Write-Host "::error::kural metninde yok: $k"; exit 1 } }
          exit 0

      - name: Video rehber uretici (gorsel uretimi + seslendirme + altyazi)
        shell: powershell
        timeout-minutes: 20
        run: |
          .\installer\RepoKurulum.ps1 -Sessiz -Bilesenler "video-rehber"
          $kod = $LASTEXITCODE
          $log = Get-ChildItem "$env:LOCALAPPDATA\RepoKurulum\logs\*.log" | Sort-Object LastWriteTime | Select-Object -Last 1
          $hatalar = Select-String -Path $log.FullName -Pattern '\[HATA\]'
          if ($hatalar) { $hatalar | ForEach-Object { Write-Host "::error::$($_.Line)" }; exit 1 }
          if ($kod -ne 0) { exit $kod }
          $ErrorActionPreference = 'Continue'
          $sk = "$env:USERPROFILE\.claude\skills\video-seslendirme"
          foreach ($f in 'SKILL.md','seslendir.py','gorsel.py','parcalar.py','ikon-dizin.json','ornek-senaryo.json','ornek-gercekci.json','ornekler\tanitim-yangin-tesisati.json','marka\logo.png') { if (-not (Test-Path "$sk\$f")) { Write-Host "::error::eksik: $f"; exit 1 } }
          $p = Join-Path $env:RUNNER_TEMP 'video-test'; New-Item -ItemType Directory -Force $p | Out-Null
          Copy-Item "$sk\ornek-senaryo.json" "$p\senaryo.json"
          & uv run --script "$sk\seslendir.py" gorsel "$p\senaryo.json" 2>&1 | Write-Host
          $png = @(Get-ChildItem "$p\gorseller\sahne_*.png")
          if ($png.Count -ne 14) { Write-Host "::error::14 sahne gorseli bekleniyordu, $($png.Count) uretildi"; exit 1 }
          Add-Type -AssemblyName System.Drawing
          $r = [System.Drawing.Image]::FromFile($png[0].FullName); $boy = "$($r.Width)x$($r.Height)"; $r.Dispose()
          if ($boy -ne '1080x1920') { Write-Host "::error::gorsel boyutu $boy (1080x1920 olmali)"; exit 1 }
          $cikti = & uv run --script "$sk\seslendir.py" olustur "$p\senaryo.json" 2>&1 | Out-String
          Write-Host $cikti
          if ($cikti -match 'KALITE: KALDI') { Write-Host '::error::kalite kontrolu KALDI'; exit 1 }
          if ($cikti -match 'TAMAM\. Sure ([\d.]+) sn, (\d+) altyazi parcasi, siyah ara: (\d+)') {
            if ([int]$Matches[3] -ne 0) { Write-Host "::error::videoda siyah ara var"; exit 1 }
            foreach ($f in 'isg-katip-sozlesme-onayi.mp4','isg-katip-sozlesme-onayi-altyazili.mp4','isg-katip-sozlesme-onayi.srt') { if (-not (Test-Path "$p\$f")) { Write-Host "::error::cikti yok: $f"; exit 1 } }
          } elseif ($cikti -match 'edge-tts calismadi') {
            Write-Host '::warning::edge-tts CI ortamindan Microsoft servisine erisemedi; gorsel uretimi dogrulandi, ses adimi atlandi'
          } else { Write-Host '::error::video uretilemedi'; exit 1 }
          # Gercekci (klip) akisi: sahte yatay klip ile istem listesi, klip kontrolu ve serit gorseli
          $g = Join-Path $env:RUNNER_TEMP 'video-klip'; New-Item -ItemType Directory -Force "$g\klipler" | Out-Null
          Copy-Item "$sk\ornek-gercekci.json" "$g\senaryo.json"
          & ffmpeg -v error -y -f lavfi -i testsrc2=s=1280x720:r=24:d=6 -c:v libx264 -pix_fmt yuv420p "$g\klipler\sahne_02.mp4"
          & uv run --script "$sk\seslendir.py" istemler "$g\senaryo.json" 2>&1 | Write-Host
          & uv run --script "$sk\seslendir.py" klipler "$g\senaryo.json" 2>&1 | Write-Host
          & uv run --script "$sk\seslendir.py" gorsel "$g\senaryo.json" 2>&1 | Write-Host
          if (-not (Test-Path "$g\veo-istemleri.md")) { Write-Host '::error::veo-istemleri.md yok'; exit 1 }
          if (-not (Test-Path "$g\klipler\kontrol_02.png")) { Write-Host '::error::klip kontrol karesi yok'; exit 1 }
          if (-not (Test-Path "$g\gorseller\serit_02.png")) { Write-Host '::error::klip serit gorseli yok'; exit 1 }
          # 3B katmanli tanitim sahneleri (Fluent Emoji 3D indirme + teknik parcalar)
          $t3 = Join-Path $env:RUNNER_TEMP 'video-3d'; New-Item -ItemType Directory -Force $t3 | Out-Null
          Copy-Item "$sk\ornekler\tanitim-yangin-tesisati.json" "$t3\senaryo.json"
          & uv run --script "$sk\seslendir.py" gorsel "$t3\senaryo.json" 2>&1 | Write-Host
          $n3 = @(Get-ChildItem "$t3\gorseller\sahne_*.png").Count
          if ($n3 -ne 10) { Write-Host "::error::3B tanitim: 10 gorsel bekleniyordu, $n3"; exit 1 }
          exit 0

      - name: Guncelleme kontrolu (-GuncellemeKontrol) hatasiz calisiyor mu
        shell: powershell
        run: |
          $cikti = .\installer\RepoKurulum.ps1 -GuncellemeKontrol *>&1 | Out-String
          Write-Host $cikti
          $kod = $LASTEXITCODE
          if ($cikti -match '\[HATA\]|Beklenmeyen') { Write-Host '::error::guncelleme kontrolunde hata'; exit 1 }
          exit $kod

      - name: Limit dolunca bekle ve devam et (hook ve zaman hesabi)
        shell: powershell
        run: |
          # Uyandirma mesaji tasarim geregi stderr'e yazilir; Actions'in 'Stop' ayari bunu olumcul sayar
          $ErrorActionPreference = 'Continue'
          $hata = @()
          .\installer\RepoKurulum.ps1 -Sessiz -Bilesenler "limit-devam"
          if ($LASTEXITCODE -ne 0) { $hata += "kurulum cikis kodu $LASTEXITCODE" }
          $s = Get-Content "$env:USERPROFILE\.claude\settings.json" -Raw | ConvertFrom-Json
          $g = @($s.hooks.StopFailure) | Where-Object { @($_.hooks | Where-Object { $_.command -match 'repokurulum-limit-devam' }).Count -gt 0 } | Select-Object -First 1
          if (-not $g) { $hata += 'StopFailure hook-u yok' } else {
            if ($g.matcher -ne 'rate_limit') { $hata += "matcher rate_limit degil: $($g.matcher)" }
            $h = @($g.hooks)[0]
            if ($h.asyncRewake -ne $true) { $hata += 'asyncRewake true degil' }
            if ([int]$h.timeout -lt 21600) { $hata += "timeout kucuk: $($h.timeout)" }
          }
          $betik = "$env:USERPROFILE\.claude\repokurulum-limit-devam.ps1"
          $env:REPOKURULUM_LIMIT_TEST = '1'
          $ld = "$env:LOCALAPPDATA\RepoKurulum\limit-durum.json"
          # 1) Durum satiri dosyasindan: 5 saatlik pencere dolu, 2 saat sonra sifirlaniyor
          $sifir = [DateTimeOffset]::UtcNow.AddHours(2).ToUnixTimeSeconds()
          ('{"five_hour":{"used_percentage":100,"resets_at":' + $sifir + '},"seven_day":{"used_percentage":40,"resets_at":' + ($sifir + 300000) + '}}') | Set-Content $ld -Encoding UTF8
          $c1 = '{"session_id":"t1","hook_event_name":"StopFailure","error":"rate_limit","error_details":"limit"}' | powershell -NoProfile -ExecutionPolicy Bypass -File $betik 2>&1 | Out-String
          $k1 = $LASTEXITCODE
          Write-Host $c1
          if ($k1 -ne 2) { $hata += "durum dosyali senaryoda cikis kodu 2 degil: $k1" }
          if ($c1 -notmatch 'KAYNAK=durum satiri \(five_hour') { $hata += 'durum satiri dosyasi kullanilmadi' }
          if ($c1 -notmatch 'KALDIGIN YERDEN') { $hata += 'uyandirma mesaji yok' }
          $hedef1 = [DateTime]::Parse((($c1 -split "`n") | Where-Object { $_ -match '^HEDEF=' } | Select-Object -First 1).Substring(6))
          $beklenen = [DateTimeOffset]::FromUnixTimeSeconds($sifir).LocalDateTime.AddSeconds(90)
          if ([Math]::Abs(($hedef1 - $beklenen).TotalSeconds) -gt 5) { $hata += "hedef zaman yanlis: $hedef1 beklenen $beklenen" }
          # 2) Dosya yok -> hata metninden "resets h:mmpm (UTC)" (saatten bagimsiz: 2 saat sonrasi)
          Remove-Item $ld -Force
          $u = [DateTime]::UtcNow.AddHours(2)
          $metinSaat = $u.ToString('h:mmtt', [Globalization.CultureInfo]::InvariantCulture).ToLower()
          $giris = '{"session_id":"t2","hook_event_name":"StopFailure","error":"rate_limit","error_details":"You have hit your 5-hour limit - resets ' + $metinSaat + ' (UTC)"}'
          $c2 = $giris | powershell -NoProfile -ExecutionPolicy Bypass -File $betik 2>&1 | Out-String
          Write-Host $c2
          if ($c2 -notmatch 'KAYNAK=hata metni') { $hata += 'hata metni ayristirilamadi' }
          $hedef2 = [DateTime]::Parse((($c2 -split "`n") | Where-Object { $_ -match '^HEDEF=' } | Select-Object -First 1).Substring(6)).ToUniversalTime()
          $beklenen2 = (New-Object DateTime($u.Year, $u.Month, $u.Day, $u.Hour, $u.Minute, 0, [DateTimeKind]::Utc)).AddSeconds(90)
          if ([Math]::Abs(($hedef2 - $beklenen2).TotalSeconds) -gt 5) { $hata += "hata metninden hedef yanlis: $hedef2 beklenen $beklenen2 (metin: $metinSaat UTC)" }
          # 3) Limit disi hata -> devreye girmemeli
          $c3 = '{"session_id":"t3","hook_event_name":"StopFailure","error":"server_error"}' | powershell -NoProfile -ExecutionPolicy Bypass -File $betik 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0 -or $c3 -match 'HEDEF=') { $hata += 'limit disi hatada devreye girdi' }
          if ($hata) { $hata | ForEach-Object { Write-Host "::error::$_" }; exit 1 }

      - name: GLM kod ajanlari (calistiricilar, ajan dosyasi, ortam izolasyonu)
        shell: powershell
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Continue'
          $hata = @()
          $env:ZAI_API_KEY = 'test-sahte-anahtar'
          .\installer\RepoKurulum.ps1 -Sessiz -Bilesenler "glm-ajanlar"
          if ($LASTEXITCODE -ne 0) { $hata += "kurulum cikis kodu $LASTEXITCODE" }
          $bin = "$env:USERPROFILE\.local\bin"
          foreach ($f in "$bin\glm-kod.cmd","$bin\glm-kod","$env:USERPROFILE\.claude\agents\glm-kodcu.md") { if (-not (Test-Path $f)) { $hata += "dosya yok: $f" } }
          if ((Get-Content "$bin\glm-kod" -Raw) -match "`r") { $hata += 'bash calistiricisinda CRLF var (LF olmali)' }
          $v1 = & "$bin\glm-kod.cmd" --version 2>&1 | Out-String
          Write-Host "cmd: $v1"
          if ($v1 -notmatch 'Claude Code') { $hata += 'glm-kod.cmd calismadi' }
          $bash = "$env:ProgramFiles\Git\bin\bash.exe"
          $v2 = & $bash -c "'$($bin -replace '\\','/')/glm-kod' --version" 2>&1 | Out-String
          Write-Host "bash: $v2"
          if ($v2 -notmatch 'Claude Code') { $hata += 'bash glm-kod calismadi' }
          if ($env:ANTHROPIC_BASE_URL -or $env:ANTHROPIC_AUTH_TOKEN) { $hata += 'ana ortam degisti (izolasyon bozuk)' }
          $log = Get-ChildItem "$env:LOCALAPPDATA\RepoKurulum\logs\kurulum_*.log" | Sort-Object LastWriteTime | Select-Object -Last 1
          Get-Content $log.FullName | Select-Object -Last 12 | Write-Host
          if ($hata) { $hata | ForEach-Object { Write-Host "::error::$_" }; exit 1 }

      - name: Sig klonlu repo guncellemesi (git reset --keep)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $hata = @()
          $d = "$env:USERPROFILE\.claude\skills\video-shotcraft"
          if (-not (Test-Path "$d\.git")) { Write-Host '::warning::video-shotcraft kurulu degil, test atlandi'; exit 0 }
          git -C $d fetch --depth 2 origin HEAD 2>&1 | Out-Null
          git -C $d reset --hard HEAD~1 2>&1 | Out-Null
          $once = (git -C $d rev-parse HEAD).Trim()
          $uzak = ((git ls-remote https://github.com/Vincentwei1021/video-shotcraft.git HEAD) -split '\s+')[0]
          Write-Host "yerel(eski)=$once uzak=$uzak"
          if ($once -eq $uzak) { Write-Host '::warning::geri alinamadi, test atlandi'; exit 0 }
          .\installer\RepoKurulum.ps1 -Guncelle | Out-Null
          $sonra = (git -C $d rev-parse HEAD).Trim()
          Write-Host "guncelleme sonrasi=$sonra"
          if ($sonra -ne $uzak) { $hata += "video-shotcraft guncellenmedi ($sonra != $uzak)" }
          $log = Get-ChildItem "$env:LOCALAPPDATA\RepoKurulum\logs\kurulum_*.log" | Sort-Object LastWriteTime | Select-Object -Last 1
          $satir = Select-String -Path $log.FullName -Pattern 'video-shotcraft.*guncellenemedi'
          if ($satir) { $hata += 'logda guncellenemedi hatasi var' }
          if ($hata) { $hata | ForEach-Object { Write-Host "::error::$_" }; exit 1 }

      - name: uv 'Executable already exists' durumunda --force ile kurulum
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          uv tool uninstall notebooklm-py 2>&1 | Out-Null
          Remove-Item "$env:USERPROFILE\.claude\skills\notebooklm" -Recurse -Force -ErrorAction SilentlyContinue
          # Baska kaynaktan kalmis gibi sahte bir notebooklm-mcp.exe birak
          Copy-Item (Get-Command uv).Source "$env:USERPROFILE\.local\bin\notebooklm-mcp.exe" -Force
          .\installer\RepoKurulum.ps1 -Sessiz -Bilesenler "notebooklm"
          $kod = $LASTEXITCODE
          $log = Get-ChildItem "$env:LOCALAPPDATA\RepoKurulum\logs\kurulum_*.log" | Sort-Object LastWriteTime | Select-Object -Last 1
          Get-Content $log.FullName | Select-String 'force|KURULAMADI|kuruldu' | Write-Host
          if ($kod -ne 0) { Write-Host "::error::notebooklm --force ile kurulamadi (cikis $kod)"; exit 1 }

      - name: Kural metni (-Kurallar) sadece kurulu araclari iceriyor mu, dosyaya yazmiyor mu
        shell: powershell
        run: |
          $md = "$env:USERPROFILE\.claude\CLAUDE.md"
          $once = if (Test-Path $md) { (Get-FileHash $md).Hash } else { 'yok' }
          $m = & .\installer\RepoKurulum.ps1 -Kurallar | Out-String
          Write-Host $m
          $hata = @()
          if ($m -notmatch '\*\*context7\*\*') { $hata += 'kurulu context7 yok' }
          if ($m -notmatch '\*\*playwright\*\*') { $hata += 'kurulu playwright yok' }
          if ($m -match '\*\*tavily\*\*') { $hata += 'kurulu olmayan tavily var' }
          $sonra = if (Test-Path $md) { (Get-FileHash $md).Hash } else { 'yok' }
          if ($once -ne $sonra) { $hata += 'CLAUDE.md degisti (yazmamaliydi)' }
          $hepsi = & .\installer\RepoKurulum.ps1 -TumKurallar | Out-String
          if ($hepsi -notmatch '\*\*tavily\*\*') { $hata += '-TumKurallar tavily icermiyor' }
          if ($hata) { $hata | ForEach-Object { Write-Host "::error::$_" }; exit 1 }

      - name: ClaudeAc.bat (kuru calisma)
        shell: cmd
        run: |
          set CLAUDEAC_KURU=1
          set CLAUDEAC_GUNCELLEME=0
          call ClaudeAc.bat "%CD%" devam > ca.txt 2>&1
          type ca.txt
          findstr /c:"KURU CALISMA: claude --continue" ca.txt || exit /b 1
          findstr /c:"%CD%" "%LOCALAPPDATA%\RepoKurulum\son-klasor.txt" || exit /b 1
          call ClaudeAc.bat "C:\yok\boyle\klasor" yeni > ca2.txt 2>&1
          if not errorlevel 1 (echo Olmayan klasorde hata vermedi & exit /b 1)
          type ca2.txt
          exit /b 0

      - name: Arayuz acilip kapaniyor mu (pencere testi)
        shell: powershell
        timeout-minutes: 5
        run: |
          $env:REPOKURULUM_ARAYUZ_TEST = '1'
          $p = Start-Process powershell.exe -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-STA','-File',"`"$PWD\installer\RepoKurulum.ps1`"" -PassThru -Wait
          $log = Get-ChildItem "$env:LOCALAPPDATA\RepoKurulum\logs\*.log" | Sort-Object LastWriteTime | Select-Object -Last 1
          Get-Content $log.FullName | Write-Host
          if (-not (Select-String -Path $log.FullName -Pattern 'ARAYUZ_OK' -Quiet)) { Write-Host '::error::Arayuz acilmadi'; exit 1 }
          if (Select-String -Path $log.FullName -Pattern 'Beklenmeyen hata|\[HATA\]' -Quiet) { Write-Host '::error::Arayuzde hata'; exit 1 }

      - name: Tek satirlik baslatma (bootstrap) - bu commit ile, bosluklu kullanici yolu
        shell: powershell
        run: |
          $env:REPOKURULUM_DAL = '${{ github.sha }}'
          $env:REPOKURULUM_SESSIZ = '1'
          $env:REPOKURULUM_BILESENLER = 'uv,playwright-mcp'
          $env:LOCALAPPDATA = "$env:RUNNER_TEMP\Ali Veli'nin Klasoru"
          New-Item -ItemType Directory -Force $env:LOCALAPPDATA | Out-Null
          $cikti = & { Get-Content .\bootstrap.ps1 -Raw | Invoke-Expression } *>&1 | Out-String
          Write-Host $cikti
          if ($cikti -notmatch 'Bitti\.') { Write-Host '::error::bootstrap basarisiz'; exit 1 }

      - name: Loglari topla
        if: always()
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force loglar | Out-Null
          Copy-Item "$env:LOCALAPPDATA\RepoKurulum\logs\*" loglar -ErrorAction SilentlyContinue
          if (Get-Command claude -ErrorAction SilentlyContinue) { claude mcp list | Out-File loglar\mcp-list.txt }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kurulum-loglari
          path: loglar

  exe:
    name: RepoKurulum.exe derle
    needs: dogrula
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: ps2exe ile derle
        shell: powershell
        run: |
          Install-Module ps2exe -Scope CurrentUser -Force
          Import-Module ps2exe
          Invoke-ps2exe -inputFile .\bootstrap.ps1 -outputFile .\RepoKurulum.exe `
            -title 'Repo Kurulum' -description 'Claude Code + MCP + skill kurulum araci' `
            -product 'RepoKurulum' -version '1.0.0.0'
          if (-not (Test-Path .\RepoKurulum.exe)) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: RepoKurulum-exe
          path: RepoKurulum.exe

      - name: Etiketliyse surum (release) olustur
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: RepoKurulum.exe
